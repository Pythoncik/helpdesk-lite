{% load static %}
<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>{% block title %}HelpDesk Lite{% endblock %}</title><link rel="stylesheet" href="{% static 'tickets/style.css' %}"></head><body><header class="topbar"><div class="container nav"><a class="brand" href="{% url 'ticket_list' %}">HelpDesk Lite</a><nav>{% if user.is_authenticated %}<a href="{% url 'ticket_list' %}">Tickets</a><a href="{% url 'ticket_create' %}">+ Neues Ticket</a><form method="post" action="{% url 'logout' %}" class="inline">{% csrf_token %}<button class="link-button">Abmelden</button></form>{% else %}<a href="{% url 'login' %}">Anmelden</a><a href="{% url 'register' %}">Registrieren</a>{% endif %}</nav></div></header><main class="container">{% for message in messages %}<div class="message">{{ message }}</div>{% endfor %}{% block content %}{% endblock %}</main></body></html>
